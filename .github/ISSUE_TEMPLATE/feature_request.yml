name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Safety, privacy, and compatibility considerations
