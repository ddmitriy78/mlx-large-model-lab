[project]
name = "mlx-large-model-lab"
version = "0.1.0"
description = "A local MLX lab for running and benchmarking large coding and reasoning models on Apple Silicon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "huggingface-hub[hf-xet]>=0.34.0",
  "mlx-lm>=0.27.0",
  "psutil>=5.9.0",
  "rich>=13.7.0",
]

[project.scripts]
mlx-lab = "mlx_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_lab"]
